name: Extract iOS SDK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  extract-sdk:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          which xcrun

      - name: Find iOS SDK path
        id: sdk
        run: |
          # Find the latest iOS SDK
          IOS_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "ios_sdk_path=$IOS_SDK_PATH" >> $GITHUB_OUTPUT
          echo "Found iOS SDK at: $IOS_SDK_PATH"
          ls -la "$IOS_SDK_PATH"

      - name: Package iOS SDK
        run: |
          IOS_SDK_PATH="${{ steps.sdk.outputs.ios_sdk_path }}"
          cd /tmp
          # Create a tarball of the SDK
          tar -czf ios-sdk.tar.gz -C "$(dirname "$IOS_SDK_PATH")" "$(basename "$IOS_SDK_PATH")"
          echo "Package size:"
          ls -lh ios-sdk.tar.gz

      - name: Upload iOS SDK
        uses: actions/upload-artifact@v4
        with:
          name: ios-sdk
          path: /tmp/ios-sdk.tar.gz
          retention-days: 30
          compression-level: 0  # Already compressed

      - name: Upload to Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/ios-sdk.tar.gz
          name: iOS SDK Extraction
          tag_name: ios-sdk-${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
