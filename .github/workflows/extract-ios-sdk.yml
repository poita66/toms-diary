name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-app:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build iOS App
        run: |
          cd ios-app
          # List available schemes
          xcodebuild -project TomsDiary.xcodeproj -list
          
          # Build without specifying a scheme (uses default)
          xcodebuild -project TomsDiary.xcodeproj \
            -configuration Debug \
            -derivedDataPath Build \
            -sdk iphonesimulator \
            clean build

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: TomsDiary-app
          path: ios-app/Build/Build/Products/Debug-iphonesimulator/TomsDiary.app
          retention-days: 30

      - name: Create .ipa
        run: |
          cd ios-app/Build/Build/Products/Debug-iphonesimulator
          mkdir -p Payload
          cp -r TomsDiary.app Payload/
          zip -r TomsDiary.ipa Payload

      - name: Upload .ipa file
        uses: actions/upload-artifact@v4
        with:
          name: TomsDiary-ipa
          path: ios-app/Build/Build/Products/Debug-iphonesimulator/TomsDiary.ipa
          retention-days: 30
